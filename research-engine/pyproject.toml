[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-engine"
version = "0.1.0"
description = "Point-in-time quantitative factor research and validation engine"
requires-python = ">=3.11,<3.15"
dependencies = [
    "hmmlearn==0.3.3",
    "numpy==2.4.6",
    "polars==1.43.0",
    "psycopg[binary]==3.3.4",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "vectorbt==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
quant-research = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
