# Internal metrics token must have operations:read and be refreshed before expiry.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_TOKEN_FILE:?Provide a rotating operator token file}:/run/secrets/metrics-token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
volumes:
  prometheus-data:
