version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    ports:
      - "6543:5432" # Avoid conflicts with local Postgres instances on 5432
    environment:
      - POSTGRES_DB=${TIMESCALEDB_DB:-quant_platform}
      - POSTGRES_USER=${TIMESCALEDB_USER:-postgres}
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    volumes:
      - pgdata:/home/postgres/pgdata

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pgdata:
