name: quant-platform

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1-all-oss
    profiles: [infrastructure, application]
    ports:
      - "127.0.0.1:6543:5432"
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-quant_platform}
      POSTGRES_USER: ${TIMESCALEDB_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/001-timescaledb-extension.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-migrations:
    profiles: [infrastructure, application]
    build:
      context: ..
      dockerfile: database-migrations/Dockerfile
    environment:
      DATABASE_MIGRATION_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-quant_migrator}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  market-data-producer:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: market-data-producer
    ports:
      - "127.0.0.1:${MARKET_DATA_HOST_PORT:-18084}:8084"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      MARKET_DATA_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      MARKET_DATA_DB_USER: ${MARKET_DATA_DB_USER:-quant_ingestion}
      MARKET_DATA_DB_PASSWORD: ${MARKET_DATA_DB_PASSWORD:-}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      SEC_MAPPING_VERSION: ${SEC_MAPPING_VERSION:-sec-us-gaap-v1}
      SEC_FUNDAMENTALS_ENABLED: ${SEC_FUNDAMENTALS_ENABLED:-false}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_FILINGS_START_DATE: ${SEC_FILINGS_START_DATE:-2010-01-01}
      SEC_REQUEST_SPACING: ${SEC_REQUEST_SPACING:-200ms}
      FFIEC_BULK_FILE: ${FFIEC_BULK_FILE:-}
      FFIEC_IDENTITY_MANIFEST: ${FFIEC_IDENTITY_MANIFEST:-}
      MARKET_DATA_LATEST_BARS_ENABLED: ${MARKET_DATA_LATEST_BARS_ENABLED:-true}
      MARKET_DATA_BACKFILL_ENABLED: ${MARKET_DATA_BACKFILL_ENABLED:-false}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      DAILY_PRICE_FEED: ${DAILY_PRICE_FEED:-sip}
      DAILY_PRICE_SYMBOLS_PER_REQUEST: ${DAILY_PRICE_SYMBOLS_PER_REQUEST:-100}
      DAILY_PRICE_REQUEST_SPACING: ${DAILY_PRICE_REQUEST_SPACING:-350ms}
      DAILY_PRICE_PUBLICATION_DELAY: ${DAILY_PRICE_PUBLICATION_DELAY:-16m}
      DAILY_PRICE_RAW_ENABLED: ${DAILY_PRICE_RAW_ENABLED:-true}
      DAILY_PRICE_ADJUSTED_ENABLED: ${DAILY_PRICE_ADJUSTED_ENABLED:-true}
      DAILY_PRICE_CORPORATE_ACTIONS_ENABLED: ${DAILY_PRICE_CORPORATE_ACTIONS_ENABLED:-true}
      DAILY_PRICE_ACTIONS_REFRESH_DAYS: ${DAILY_PRICE_ACTIONS_REFRESH_DAYS:-14}
      INGESTION_MODE: ${INGESTION_MODE:-catch-up-and-serve}
      INGESTION_SCHEDULES_ENABLED: ${INGESTION_SCHEDULES_ENABLED:-true}
      INGESTION_ITEMS_PER_CYCLE: ${INGESTION_ITEMS_PER_CYCLE:-100}
      INGESTION_START_DATE: ${INGESTION_START_DATE:-}
      INGESTION_END_DATE: ${INGESTION_END_DATE:-}
      INGESTION_SYNC_TIMEOUT: ${INGESTION_SYNC_TIMEOUT:-10m}
      INGESTION_PRICE_HISTORY_UNIVERSE_DATE: ${INGESTION_PRICE_HISTORY_UNIVERSE_DATE:-}
      REFERENCE_DATA_IMPORT_ENABLED: ${REFERENCE_DATA_IMPORT_ENABLED:-false}
      REFERENCE_DATA_IMPORT_FILE: ${REFERENCE_DATA_IMPORT_FILE:-}
      REFERENCE_DATA_IMPORT_UNIVERSE: ${REFERENCE_DATA_IMPORT_UNIVERSE:-}
      REFERENCE_DATA_IMPORT_EFFECTIVE_DATE: ${REFERENCE_DATA_IMPORT_EFFECTIVE_DATE:-}
      REFERENCE_DATA_IMPORT_AVAILABLE_AT: ${REFERENCE_DATA_IMPORT_AVAILABLE_AT:-}
      REFERENCE_DATA_IMPORT_OBSERVED_AT: ${REFERENCE_DATA_IMPORT_OBSERVED_AT:-}
      REFERENCE_DATA_IMPORT_SOURCE: ${REFERENCE_DATA_IMPORT_SOURCE:-}
      REFERENCE_DATA_IMPORT_SOURCE_URI: ${REFERENCE_DATA_IMPORT_SOURCE_URI:-}
      REFERENCE_DATA_IMPORT_MODE: ${REFERENCE_DATA_IMPORT_MODE:-CURRENT_SNAPSHOT_FORWARD}
      REFERENCE_DATA_IMPORT_COMPLETENESS: ${REFERENCE_DATA_IMPORT_COMPLETENESS:-COMPLETE}
      REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT: ${REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT:-0}
      REFERENCE_DATA_CLASSIFICATION_SOURCE: ${REFERENCE_DATA_CLASSIFICATION_SOURCE:-}
      REFERENCE_DATA_CLASSIFICATION_VERSION: ${REFERENCE_DATA_CLASSIFICATION_VERSION:-}
      # P2s stage B: canonical processing and the dead-letter quarantine run in the collector.
      CANONICAL_DELIVERY_ENABLED: ${CANONICAL_DELIVERY_ENABLED:-true}
      CANONICAL_OPERATION: ${CANONICAL_OPERATION:-serve}
    volumes:
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
      - ./reference-data:/reference-data:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # P2s: one HTTP backend (accounts, holdings, screener) replaces gateway, auth, portfolio and screener.
  web-backend:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: web-backend
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-${GATEWAY_HOST_PORT:-18080}}:8080"
    environment:
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-}
      JWT_PRIVATE_KEY: file:/run/signing/private.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      WEB_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      WEB_DB_USER: ${WEB_DB_USER:-quant_web}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:-}
    volumes:
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
      - ./keys/private.pem:/run/signing/private.pem:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
