name: quant-platform

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1-all-oss
    profiles: [infrastructure, application]
    ports:
      - "127.0.0.1:6543:5432"
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-quant_platform}
      POSTGRES_USER: ${TIMESCALEDB_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/001-timescaledb-extension.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-migrations:
    profiles: [infrastructure, application]
    build:
      context: ..
      dockerfile: database-migrations/Dockerfile
    environment:
      DATABASE_MIGRATION_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-quant_migrator}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    profiles: [infrastructure, application]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/http.key
      xpack.security.http.ssl.certificate: certs/http.crt
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./certs/elasticsearch:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --cacert config/certs/ca.crt -u "elastic:$${ELASTIC_PASSWORD}" https://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.11
    profiles: [infrastructure, application]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, cub zk-ready localhost 30]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.11
    profiles: [infrastructure, application]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: SSL://0.0.0.0:9092,SSL_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: SSL://localhost:9092,SSL_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,SSL_INTERNAL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL_INTERNAL
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-password
      KAFKA_SSL_KEY_CREDENTIALS: key-password
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore-password
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./certs/kafka:/etc/kafka/secrets:ro
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  auth-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: auth-service
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT:-18081}:8081"
    environment:
      JWT_PRIVATE_KEY: file:/run/signing/private.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      AUTH_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      AUTH_DB_USER: ${AUTH_DB_USER:-quant_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
    volumes:
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
      - ./keys/private.pem:/run/signing/private.pem:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  portfolio-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: portfolio-service
    ports:
      - "127.0.0.1:${PORTFOLIO_HOST_PORT:-18083}:8083"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      PORTFOLIO_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      PORTFOLIO_DB_USER: ${PORTFOLIO_DB_USER:-quant_portfolio}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:-}
    volumes:
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  market-data-producer:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: market-data-producer
    ports:
      - "127.0.0.1:${MARKET_DATA_HOST_PORT:-18084}:8084"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      MARKET_DATA_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      MARKET_DATA_DB_USER: ${MARKET_DATA_DB_USER:-quant_ingestion}
      MARKET_DATA_DB_PASSWORD: ${MARKET_DATA_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SSL_KEYSTORE_LOCATION: /run/kafka/client.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: ${INGESTION_KAFKA_KEYSTORE_PASSWORD:-}
      KAFKA_SSL_KEY_PASSWORD: ${INGESTION_KAFKA_KEY_PASSWORD:-}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /run/kafka/client.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${INGESTION_KAFKA_TRUSTSTORE_PASSWORD:-}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      SEC_FUNDAMENTALS_ENABLED: ${SEC_FUNDAMENTALS_ENABLED:-false}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_FILINGS_START_DATE: ${SEC_FILINGS_START_DATE:-2010-01-01}
      SEC_REQUEST_SPACING: ${SEC_REQUEST_SPACING:-200ms}
      FFIEC_BULK_FILE: ${FFIEC_BULK_FILE:-}
      FFIEC_IDENTITY_MANIFEST: ${FFIEC_IDENTITY_MANIFEST:-}
      MARKET_DATA_LATEST_BARS_ENABLED: ${MARKET_DATA_LATEST_BARS_ENABLED:-true}
      MARKET_DATA_BACKFILL_ENABLED: ${MARKET_DATA_BACKFILL_ENABLED:-false}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      DAILY_PRICE_FEED: ${DAILY_PRICE_FEED:-sip}
      DAILY_PRICE_SYMBOLS_PER_REQUEST: ${DAILY_PRICE_SYMBOLS_PER_REQUEST:-100}
      DAILY_PRICE_REQUEST_SPACING: ${DAILY_PRICE_REQUEST_SPACING:-350ms}
      DAILY_PRICE_PUBLICATION_DELAY: ${DAILY_PRICE_PUBLICATION_DELAY:-16m}
      DAILY_PRICE_ADJUSTED_ENABLED: ${DAILY_PRICE_ADJUSTED_ENABLED:-true}
      DAILY_PRICE_CORPORATE_ACTIONS_ENABLED: ${DAILY_PRICE_CORPORATE_ACTIONS_ENABLED:-true}
      DAILY_PRICE_ACTIONS_REFRESH_DAYS: ${DAILY_PRICE_ACTIONS_REFRESH_DAYS:-14}
      INGESTION_MODE: ${INGESTION_MODE:-catch-up-and-serve}
      INGESTION_SCHEDULES_ENABLED: ${INGESTION_SCHEDULES_ENABLED:-true}
      INGESTION_ITEMS_PER_CYCLE: ${INGESTION_ITEMS_PER_CYCLE:-100}
      REFERENCE_DATA_IMPORT_ENABLED: ${REFERENCE_DATA_IMPORT_ENABLED:-false}
      REFERENCE_DATA_IMPORT_FILE: ${REFERENCE_DATA_IMPORT_FILE:-}
      REFERENCE_DATA_IMPORT_UNIVERSE: ${REFERENCE_DATA_IMPORT_UNIVERSE:-}
      REFERENCE_DATA_IMPORT_EFFECTIVE_DATE: ${REFERENCE_DATA_IMPORT_EFFECTIVE_DATE:-}
      REFERENCE_DATA_IMPORT_AVAILABLE_AT: ${REFERENCE_DATA_IMPORT_AVAILABLE_AT:-}
      REFERENCE_DATA_IMPORT_OBSERVED_AT: ${REFERENCE_DATA_IMPORT_OBSERVED_AT:-}
      REFERENCE_DATA_IMPORT_SOURCE: ${REFERENCE_DATA_IMPORT_SOURCE:-}
      REFERENCE_DATA_IMPORT_SOURCE_URI: ${REFERENCE_DATA_IMPORT_SOURCE_URI:-}
      REFERENCE_DATA_IMPORT_MODE: ${REFERENCE_DATA_IMPORT_MODE:-CURRENT_SNAPSHOT_FORWARD}
      REFERENCE_DATA_IMPORT_COMPLETENESS: ${REFERENCE_DATA_IMPORT_COMPLETENESS:-COMPLETE}
      REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT: ${REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT:-0}
      REFERENCE_DATA_CLASSIFICATION_SOURCE: ${REFERENCE_DATA_CLASSIFICATION_SOURCE:-}
      REFERENCE_DATA_CLASSIFICATION_VERSION: ${REFERENCE_DATA_CLASSIFICATION_VERSION:-}
    volumes:
      - ./certs/market-data-producer:/run/kafka:ro
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
      - ./reference-data:/reference-data:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scoring-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: scoring-service
    ports:
      - "127.0.0.1:${SCORING_HOST_PORT:-18085}:8085"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      SCORING_MODEL_RAW_DATASET: ${SCORING_MODEL_RAW_DATASET:-}
      SCORING_MODEL_ADJUSTED_DATASET: ${SCORING_MODEL_ADJUSTED_DATASET:-}
      SCORING_MODEL_CLASSIFICATION_VERSION: ${SCORING_MODEL_CLASSIFICATION_VERSION:-}
      SCORING_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCORING_DB_USER: ${SCORING_DB_USER:-quant_scoring}
      SCORING_DB_PASSWORD: ${SCORING_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SSL_KEYSTORE_LOCATION: /run/kafka/client.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: ${SCORING_KAFKA_KEYSTORE_PASSWORD:-}
      KAFKA_SSL_KEY_PASSWORD: ${SCORING_KAFKA_KEY_PASSWORD:-}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /run/kafka/client.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${SCORING_KAFKA_TRUSTSTORE_PASSWORD:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-https://elasticsearch:9200}
    volumes:
      - ./certs/scoring-service:/run/kafka:ro
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  screener-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: screener-service
    ports:
      - "127.0.0.1:${SCREENER_HOST_PORT:-18082}:8082"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      SCREENER_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCREENER_DB_USER: ${SCREENER_DB_USER:-quant_screener}
      SCREENER_DB_PASSWORD: ${SCREENER_DB_PASSWORD:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-https://elasticsearch:9200}
      ELASTICSEARCH_COMPANY_INDEX: ${ELASTICSEARCH_COMPANY_INDEX:-companies-read}
      SEARCH_REBUILD_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/search/truststore.jks
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      SEARCH_REBUILD_INTERVAL: ${SEARCH_REBUILD_INTERVAL:-300000}
    volumes:
      - ./certs/search-client:/run/search:ro
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  search-indexer:
    extends:
      service: screener-service
    ports: !reset []
    command: ["--spring.main.web-application-type=none", "--spring.main.keep-alive=true"]
    environment:
      SCREENER_DB_USER: quant_search
      SCREENER_DB_PASSWORD: ${SEARCH_DB_PASSWORD:-}
      SEARCH_REBUILD_ENABLED: "true"
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_INDEXER_API_KEY:-}


  gateway-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: gateway-service
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_PUBLIC_JWKS: file:/run/keys/public.jwks.json
      AUTH_SERVICE_URI: http://auth-service:8081
      SCREENER_SERVICE_URI: http://screener-service:8082
      PORTFOLIO_SERVICE_URI: http://portfolio-service:8083
    volumes:
      - ./keys/public.jwks.json:/run/keys/public.jwks.json:ro
    depends_on:
      auth-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      screener-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
  elasticsearch-data:
  zookeeper-data:
  zookeeper-log:
