name: quant-platform

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1-all-oss
    profiles: [infrastructure, application]
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-quant_platform}
      POSTGRES_USER: ${TIMESCALEDB_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/001-timescaledb-extension.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-migrations:
    profiles: [infrastructure, application]
    build:
      context: ..
      dockerfile: database-migrations/Dockerfile
    environment:
      DATABASE_MIGRATION_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      DATABASE_MIGRATION_USER: ${TIMESCALEDB_USER:-postgres}
      DATABASE_MIGRATION_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    profiles: [infrastructure, application]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.11
    profiles: [infrastructure, application]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, cub zk-ready localhost 30]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.11
    profiles: [infrastructure, application]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  auth-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: auth-service
    ports:
      - "${AUTH_HOST_PORT:-18081}:8081"
    environment:
      AUTH_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      AUTH_DB_USER: ${TIMESCALEDB_USER:-postgres}
      AUTH_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deploying}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  portfolio-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: portfolio-service
    ports:
      - "${PORTFOLIO_HOST_PORT:-18083}:8083"
    environment:
      PORTFOLIO_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      PORTFOLIO_DB_USER: ${TIMESCALEDB_USER:-postgres}
      PORTFOLIO_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  market-data-producer:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: market-data-producer
    ports:
      - "${MARKET_DATA_HOST_PORT:-18084}:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKET_DATA_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scoring-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: scoring-service
    ports:
      - "${SCORING_HOST_PORT:-18085}:8085"
    environment:
      SCORING_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCORING_DB_USER: ${TIMESCALEDB_USER:-postgres}
      SCORING_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  screener-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: screener-service
    ports:
      - "${SCREENER_HOST_PORT:-18082}:8082"
    environment:
      SCREENER_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCREENER_DB_USER: ${TIMESCALEDB_USER:-postgres}
      SCREENER_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: gateway-service
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      SCREENER_SERVICE_URI: http://screener-service:8082
      PORTFOLIO_SERVICE_URI: http://portfolio-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deploying}
    depends_on:
      auth-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      screener-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
  elasticsearch-data:
  zookeeper-data:
  zookeeper-log:
