name: quant-platform

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1-all-oss
    profiles: [infrastructure, application]
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB:-quant_platform}
      POSTGRES_USER: ${TIMESCALEDB_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/001-timescaledb-extension.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-migrations:
    profiles: [infrastructure, application]
    build:
      context: ..
      dockerfile: database-migrations/Dockerfile
    environment:
      DATABASE_MIGRATION_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      DATABASE_MIGRATION_USER: ${TIMESCALEDB_USER:-postgres}
      DATABASE_MIGRATION_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    profiles: [infrastructure, application]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.11
    profiles: [infrastructure, application]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, cub zk-ready localhost 30]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.11
    profiles: [infrastructure, application]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  auth-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: auth-service
    ports:
      - "${AUTH_HOST_PORT:-18081}:8081"
    environment:
      AUTH_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      AUTH_DB_USER: ${TIMESCALEDB_USER:-postgres}
      AUTH_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deploying}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  portfolio-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: portfolio-service
    ports:
      - "${PORTFOLIO_HOST_PORT:-18083}:8083"
    environment:
      PORTFOLIO_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      PORTFOLIO_DB_USER: ${TIMESCALEDB_USER:-postgres}
      PORTFOLIO_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  market-data-producer:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: market-data-producer
    ports:
      - "${MARKET_DATA_HOST_PORT:-18084}:8084"
    environment:
      MARKET_DATA_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      MARKET_DATA_DB_USER: ${TIMESCALEDB_USER:-postgres}
      MARKET_DATA_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      SEC_FUNDAMENTALS_ENABLED: ${SEC_FUNDAMENTALS_ENABLED:-false}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_FILINGS_START_DATE: ${SEC_FILINGS_START_DATE:-2010-01-01}
      SEC_REQUEST_SPACING: ${SEC_REQUEST_SPACING:-200ms}
      FFIEC_BULK_FILE: ${FFIEC_BULK_FILE:-}
      FFIEC_IDENTITY_MANIFEST: ${FFIEC_IDENTITY_MANIFEST:-}
      MARKET_DATA_LATEST_BARS_ENABLED: ${MARKET_DATA_LATEST_BARS_ENABLED:-true}
      MARKET_DATA_BACKFILL_ENABLED: ${MARKET_DATA_BACKFILL_ENABLED:-false}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      DAILY_PRICE_FEED: ${DAILY_PRICE_FEED:-sip}
      DAILY_PRICE_SYMBOLS_PER_REQUEST: ${DAILY_PRICE_SYMBOLS_PER_REQUEST:-100}
      DAILY_PRICE_REQUEST_SPACING: ${DAILY_PRICE_REQUEST_SPACING:-350ms}
      DAILY_PRICE_PUBLICATION_DELAY: ${DAILY_PRICE_PUBLICATION_DELAY:-16m}
      DAILY_PRICE_ADJUSTED_ENABLED: ${DAILY_PRICE_ADJUSTED_ENABLED:-true}
      DAILY_PRICE_CORPORATE_ACTIONS_ENABLED: ${DAILY_PRICE_CORPORATE_ACTIONS_ENABLED:-true}
      DAILY_PRICE_ACTIONS_REFRESH_DAYS: ${DAILY_PRICE_ACTIONS_REFRESH_DAYS:-14}
      INGESTION_MODE: ${INGESTION_MODE:-catch-up-and-serve}
      INGESTION_SCHEDULES_ENABLED: ${INGESTION_SCHEDULES_ENABLED:-true}
      INGESTION_ITEMS_PER_CYCLE: ${INGESTION_ITEMS_PER_CYCLE:-100}
      REFERENCE_DATA_IMPORT_ENABLED: ${REFERENCE_DATA_IMPORT_ENABLED:-false}
      REFERENCE_DATA_IMPORT_FILE: ${REFERENCE_DATA_IMPORT_FILE:-}
      REFERENCE_DATA_IMPORT_UNIVERSE: ${REFERENCE_DATA_IMPORT_UNIVERSE:-}
      REFERENCE_DATA_IMPORT_EFFECTIVE_DATE: ${REFERENCE_DATA_IMPORT_EFFECTIVE_DATE:-}
      REFERENCE_DATA_IMPORT_AVAILABLE_AT: ${REFERENCE_DATA_IMPORT_AVAILABLE_AT:-}
      REFERENCE_DATA_IMPORT_OBSERVED_AT: ${REFERENCE_DATA_IMPORT_OBSERVED_AT:-}
      REFERENCE_DATA_IMPORT_SOURCE: ${REFERENCE_DATA_IMPORT_SOURCE:-}
      REFERENCE_DATA_IMPORT_SOURCE_URI: ${REFERENCE_DATA_IMPORT_SOURCE_URI:-}
      REFERENCE_DATA_IMPORT_MODE: ${REFERENCE_DATA_IMPORT_MODE:-CURRENT_SNAPSHOT_FORWARD}
      REFERENCE_DATA_IMPORT_COMPLETENESS: ${REFERENCE_DATA_IMPORT_COMPLETENESS:-COMPLETE}
      REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT: ${REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT:-0}
      REFERENCE_DATA_CLASSIFICATION_SOURCE: ${REFERENCE_DATA_CLASSIFICATION_SOURCE:-}
      REFERENCE_DATA_CLASSIFICATION_VERSION: ${REFERENCE_DATA_CLASSIFICATION_VERSION:-}
    volumes:
      - ./reference-data:/reference-data:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scoring-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: scoring-service
    ports:
      - "${SCORING_HOST_PORT:-18085}:8085"
    environment:
      SCORING_MODEL_RAW_DATASET: ${SCORING_MODEL_RAW_DATASET:-}
      SCORING_MODEL_ADJUSTED_DATASET: ${SCORING_MODEL_ADJUSTED_DATASET:-}
      SCORING_MODEL_CLASSIFICATION_VERSION: ${SCORING_MODEL_CLASSIFICATION_VERSION:-}
      SCORING_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCORING_DB_USER: ${TIMESCALEDB_USER:-postgres}
      SCORING_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  screener-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: screener-service
    ports:
      - "${SCREENER_HOST_PORT:-18082}:8082"
    environment:
      SCREENER_DB_URL: jdbc:postgresql://timescaledb:5432/${TIMESCALEDB_DB:-quant_platform}
      SCREENER_DB_USER: ${TIMESCALEDB_USER:-postgres}
      SCREENER_DB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres_secure_pass}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    profiles: [application]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.services
      target: gateway-service
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      SCREENER_SERVICE_URI: http://screener-service:8082
      PORTFOLIO_SERVICE_URI: http://portfolio-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deploying}
    depends_on:
      auth-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      screener-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
  elasticsearch-data:
  zookeeper-data:
  zookeeper-log:
