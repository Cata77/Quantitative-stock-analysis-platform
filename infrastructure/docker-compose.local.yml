# Explicitly insecure local development. Combine with docker-compose.yml; never deploy this overlay.
services:
  timescaledb:
    environment:
      POSTGRES_PASSWORD: postgres_secure_pass
    volumes:
      - ./bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
      - ./local-roles.sql:/docker-entrypoint-initdb.d/002-local-roles.sql:ro
  database-migrations:
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_MIGRATION_USER: quant_migrator
      DATABASE_MIGRATION_PASSWORD: local-quant_migrator-development-only
  market-data-producer:
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: quant-platform-local
      JWT_AUDIENCE: quant-platform
      JWT_PUBLIC_JWKS: classpath:security/local-public.jwks.json
      MARKET_DATA_DB_PASSWORD: local-quant_ingestion-development-only
    volumes: !override
      - ./reference-data:/reference-data:ro
  web-backend:
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
      SPRING_PROFILES_ACTIVE: local
      JWT_ISSUER: quant-platform-local
      JWT_AUDIENCE: quant-platform
      JWT_PUBLIC_JWKS: classpath:security/local-public.jwks.json
      JWT_PRIVATE_KEY: classpath:security/local-private.pem
      JWT_KEY_ID: local-development-only
      WEB_DB_PASSWORD: local-quant_web-development-only
      WEB_ALLOWED_ORIGINS: http://localhost:3000
    volumes: !override []
