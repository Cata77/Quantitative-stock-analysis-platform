global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: quant-services
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [gateway-service:8080, auth-service:8081, portfolio-service:8083, market-data-producer:8084, scoring-service:8085, screener-service:8082]
