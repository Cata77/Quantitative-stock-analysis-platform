global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: quant-services
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [web-backend:8080, market-data-producer:8084]
