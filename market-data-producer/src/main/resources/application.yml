server:
  port: ${MARKET_DATA_PORT:8084}

spring:
  application:
    name: market-data-producer
  datasource:
    url: ${MARKET_DATA_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${MARKET_DATA_DB_USER:postgres}
    password: ${MARKET_DATA_DB_PASSWORD:postgres_secure_pass}
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:market-data-producer}
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 2147483647
      compression-type: zstd
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

market-data:
  enabled: ${MARKET_DATA_ENABLED:false}
  symbols: ${MARKET_DATA_SYMBOLS:AAPL,MSFT}
  topic: ${MARKET_DATA_TOPIC:market-data-observations-v2}
  topic-partitions: ${MARKET_DATA_TOPIC_PARTITIONS:6}
  provider-timeout: ${MARKET_DATA_PROVIDER_TIMEOUT:10s}
  kafka-send-timeout: ${MARKET_DATA_KAFKA_SEND_TIMEOUT:15s}
  latest-bars-enabled: ${MARKET_DATA_LATEST_BARS_ENABLED:true}
  historical-backfill-enabled: ${MARKET_DATA_BACKFILL_ENABLED:false}
  historical-lookback-days: ${MARKET_DATA_BACKFILL_LOOKBACK_DAYS:365}
  historical-timeframe: ${MARKET_DATA_BACKFILL_TIMEFRAME:1Day}
  fundamentals-enabled: ${MARKET_DATA_FUNDAMENTALS_ENABLED:false}
  schedules:
    initial-delay: ${MARKET_DATA_INITIAL_DELAY_MS:15000}
    latest-bars-fixed-delay: ${MARKET_DATA_LATEST_BARS_INTERVAL_MS:60000}
    fundamentals-fixed-delay: ${MARKET_DATA_FUNDAMENTALS_INTERVAL_MS:86400000}
  providers:
    alpaca:
      base-url: ${ALPACA_BASE_URL:https://data.alpaca.markets}
      key-id: ${ALPACA_API_KEY_ID:}
      secret-key: ${ALPACA_API_SECRET_KEY:}
      feed: ${ALPACA_DATA_FEED:iex}
    alpha-vantage:
      base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
      api-key: ${ALPHA_VANTAGE_API_KEY:}

reference-data:
  import:
    enabled: ${REFERENCE_DATA_IMPORT_ENABLED:false}
    file: ${REFERENCE_DATA_IMPORT_FILE:}
    universe: ${REFERENCE_DATA_IMPORT_UNIVERSE:}
    effective-date: ${REFERENCE_DATA_IMPORT_EFFECTIVE_DATE:}
    available-at: ${REFERENCE_DATA_IMPORT_AVAILABLE_AT:}
    observed-at: ${REFERENCE_DATA_IMPORT_OBSERVED_AT:}
    source: ${REFERENCE_DATA_IMPORT_SOURCE:}
    source-uri: ${REFERENCE_DATA_IMPORT_SOURCE_URI:}
    mode: ${REFERENCE_DATA_IMPORT_MODE:CURRENT_SNAPSHOT_FORWARD}
    completeness: ${REFERENCE_DATA_IMPORT_COMPLETENESS:COMPLETE}
    expected-member-count: ${REFERENCE_DATA_IMPORT_EXPECTED_MEMBER_COUNT:0}
    classification-source: ${REFERENCE_DATA_CLASSIFICATION_SOURCE:}
    classification-version: ${REFERENCE_DATA_CLASSIFICATION_VERSION:}

logging:
  level:
    com.quantplatform.marketdata: INFO

# Daily ingestion uses the stable universe and its own explicit feed.
ingestion:
  prices:
    feed: ${DAILY_PRICE_FEED:sip}
    symbols-per-request: ${DAILY_PRICE_SYMBOLS_PER_REQUEST:100}
    page-limit: ${DAILY_PRICE_PAGE_LIMIT:10000}
    request-spacing: ${DAILY_PRICE_REQUEST_SPACING:350ms}
    publication-delay: ${DAILY_PRICE_PUBLICATION_DELAY:16m}
    adjusted-enabled: ${DAILY_PRICE_ADJUSTED_ENABLED:true}
    corporate-actions-enabled: ${DAILY_PRICE_CORPORATE_ACTIONS_ENABLED:true}
    actions-refresh-days: ${DAILY_PRICE_ACTIONS_REFRESH_DAYS:14}
