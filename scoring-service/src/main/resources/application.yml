server:
  forward-headers-strategy: none
  port: ${SCORING_PORT:8085}

spring:
  application:
    name: scoring-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SCORING_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${SCORING_DB_USER:quant_scoring}
    password: ${SCORING_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:scoring-service}
    admin:
      fail-fast: false
    consumer:
      group-id: ${SCORING_CONSUMER_GROUP:scoring-service-v2}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      concurrency: ${SCORING_CONSUMER_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health

scoring:
  model:
    raw-dataset: ${SCORING_MODEL_RAW_DATASET:}
    adjusted-dataset: ${SCORING_MODEL_ADJUSTED_DATASET:}
    classification-version: ${SCORING_MODEL_CLASSIFICATION_VERSION:}
  command:
    operation: ${SCORING_OPERATION:serve}
  input-topic: ${MARKET_DATA_TOPIC:market-data-observations-v2}
  dead-letter-topic: ${MARKET_DATA_DLQ_TOPIC:market-data-observations-v2-dlq}
  topic-partitions: ${MARKET_DATA_TOPIC_PARTITIONS:6}
  consumer-concurrency: ${SCORING_CONSUMER_CONCURRENCY:3}
  retry-backoff: ${SCORING_RETRY_BACKOFF:1s}
  retry-attempts: ${SCORING_RETRY_ATTEMPTS:3}
  momentum-lookback: ${SCORING_MOMENTUM_LOOKBACK:365d}
  minimum-universe-size: ${SCORING_MINIMUM_UNIVERSE_SIZE:3}
  schedule-cron: ${SCORING_SCHEDULE_CRON:0 5 0 * * *}
  schedule-zone: ${SCORING_SCHEDULE_ZONE:UTC}
  elasticsearch:
    enabled: ${SCORING_ELASTICSEARCH_ENABLED:false}
    base-url: ${ELASTICSEARCH_URL:https://localhost:9200}
    company-index: ${ELASTICSEARCH_COMPANY_INDEX:companies}

logging:
  level:
    com.quantplatform.scoring: INFO
