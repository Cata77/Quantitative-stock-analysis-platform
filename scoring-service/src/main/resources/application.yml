server:
  forward-headers-strategy: none
  port: ${SCORING_PORT:8085}

spring:
  application:
    name: scoring-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SCORING_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${SCORING_DB_USER:quant_scoring}
    password: ${SCORING_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health

scoring:
  # Score publication is in research-engine (python -m quant_research.publication.cli, P2s).
  command:
    operation: ${SCORING_OPERATION:serve}
  # Inbox identity of the canonical consumer; must stay stable across transports (P2s).
  consumer-name: ${SCORING_CONSUMER_GROUP:scoring-service-v2}
  delivery:
    enabled: ${SCORING_DELIVERY_ENABLED:true}
    interval-ms: ${SCORING_DELIVERY_INTERVAL_MS:1000}
    lease: ${SCORING_DELIVERY_LEASE:PT2M}
  input-topic: ${MARKET_DATA_TOPIC:market-data-observations-v2}
  dead-letter-topic: ${MARKET_DATA_DLQ_TOPIC:market-data-observations-v2-dlq}
  topic-partitions: ${MARKET_DATA_TOPIC_PARTITIONS:6}
  consumer-concurrency: ${SCORING_CONSUMER_CONCURRENCY:3}
  retry-backoff: ${SCORING_RETRY_BACKOFF:1s}
  retry-attempts: ${SCORING_RETRY_ATTEMPTS:3}
  momentum-lookback: ${SCORING_MOMENTUM_LOOKBACK:365d}
  minimum-universe-size: ${SCORING_MINIMUM_UNIVERSE_SIZE:3}
  schedule-cron: ${SCORING_SCHEDULE_CRON:0 5 0 * * *}
  schedule-zone: ${SCORING_SCHEDULE_ZONE:UTC}

logging:
  level:
    com.quantplatform.scoring: INFO
