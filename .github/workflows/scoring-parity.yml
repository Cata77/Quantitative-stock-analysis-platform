name: Platform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: research-engine/src
      # Python publication and input-query tests against a disposable TimescaleDB container.
      QUANT_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install uv==0.8.22
      - run: uv sync --project research-engine --extra dev --locked
      - run: echo "$GITHUB_WORKSPACE/research-engine/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pytest research-engine/tests
      # Archived P0/P2 audit tools stay reproducible (P2s).
      - run: python -m pytest research-engine/archive/p0_p2_audits/tests
      - run: python -m ruff check research-engine
      - run: bash gradlew test bootJar
      - run: docker compose -f infrastructure/docker-compose.yml config --quiet
      - run: docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.local.yml config --quiet
      - name: Validate operational overlays
        env:
          METRICS_TOKEN_FILE: /tmp/metrics-token
          BACKUP_DB_USER: quant_backup
          BACKUP_DIRECTORY: /tmp/quant-backups
          BACKUP_PGPASS_FILE: /tmp/backup-pgpass
        run: docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.monitoring.yml -f infrastructure/docker-compose.backup.yml config --quiet
      - name: Validate monitoring rules and alert behavior
        run: |
          docker run --rm --entrypoint promtool -v "$GITHUB_WORKSPACE/infrastructure/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -v "$GITHUB_WORKSPACE/infrastructure/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
      - run: git diff --exit-code -- '**/gradle.lockfile' research-engine/uv.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            **/build/reports/tests/
            **/build/test-results/
            scoring-service/build/reports/*.jfr
