name: Scoring model parity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PARITY_PYTHON: python
      PYTHONPATH: research-engine/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -e 'research-engine[dev]'
      - run: python -m pytest research-engine/tests
      - run: python -m ruff check research-engine
      - run: bash gradlew :database-migrations:test :scoring-service:test :scoring-service:bootJar
