server:
  forward-headers-strategy: none
  port: ${AUTH_PORT:8081}

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${AUTH_DB_USER:quant_auth}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    key-id: ${JWT_KEY_ID:}
    expiration: ${JWT_EXPIRATION:15m}
