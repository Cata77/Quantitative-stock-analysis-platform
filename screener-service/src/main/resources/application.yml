server:
  forward-headers-strategy: none
  port: ${SCREENER_PORT:8082}

spring:
  application:
    name: screener-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SCREENER_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${SCREENER_DB_USER:quant_screener}
    password: ${SCREENER_DB_PASSWORD:}
    hikari:
      read-only: false # Requests use read-only transactions; the quant_screener role has no write grants.
      maximum-pool-size: ${SCREENER_DB_POOL_SIZE:10}
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.quantplatform.screener: INFO
