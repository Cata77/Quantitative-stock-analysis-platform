plugins {
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.quantplatform.screener.ScreenerApplication'
}

dependencies {
    implementation project(':observability-common')
    implementation project(':security-common')
    testImplementation testFixtures(project(':security-common'))
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Jackson 2 for the stored read models (rankings, financials).
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

sourceSets.test.resources.srcDir project(':database-migrations').file('src/main/resources')
