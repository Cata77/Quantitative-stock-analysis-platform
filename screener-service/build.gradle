plugins {
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.quantplatform.screener.ScreenerApplication'
}

dependencies {
    implementation project(':observability-common')
    implementation project(':security-common')
    testImplementation testFixtures(project(':security-common'))
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // The deployed cluster is Elasticsearch 8.11.0, so keep the official client
    // on the same major/minor instead of inheriting Spring Boot 4's 9.x client.
    implementation 'co.elastic.clients:elasticsearch-java:8.11.0'
    implementation 'org.elasticsearch.client:elasticsearch-rest-client:8.11.0'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-elasticsearch'
}

sourceSets.test.resources.srcDir project(':database-migrations').file('src/main/resources')
