plugins {
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.quantplatform.screener.ScreenerApplication'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // The deployed cluster is Elasticsearch 8.11.0, so keep the official client
    // on the same major/minor instead of inheriting Spring Boot 4's 9.x client.
    implementation 'co.elastic.clients:elasticsearch-java:8.11.0'
    implementation 'org.elasticsearch.client:elasticsearch-rest-client:8.11.0'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
}
