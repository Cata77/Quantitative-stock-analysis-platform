server:
  forward-headers-strategy: none
  port: ${PORTFOLIO_PORT:8083}

spring:
  application:
    name: portfolio-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:postgresql://localhost:6543/quant_platform}
    username: ${PORTFOLIO_DB_USER:quant_portfolio}
    password: ${PORTFOLIO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
